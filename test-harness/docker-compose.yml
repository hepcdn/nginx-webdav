# Self-contained HEPCDN test deployment
#
#   idp   - mock OIDC identity provider (WLCG JWT profile, RS256)
#   node1 - node4 - hepcdn/nginx-webdav storage gateways
#
# The nodes are built from the nginx/ directory of this very repository
# (build context ../nginx), so the stack always matches the checkout.
# All services share one self-signed test CA (./certs, generated by
# setup.sh). Each node trusts:
#   * the IdP's certificate            (token endpoint over HTTPS)
#   * the other nodes' certificates    (gossip + TPC over HTTPS)
# via the CA bundle mounted over the image's lua_ssl_trusted_certificate
# path (see nginx/conf.d/default.conf in the repo).
#
# Bring up:   ./setup.sh        (generates certs/configs, then compose up)
# Verify:     ./verify.sh
# Tear down:  docker compose down -v

name: hepcdn-test

x-node-env: &node-env
  PORT: "8080"
  USE_SSL: "true"
  SSL_HOST_CERT: /etc/grid-security/hostcert.pem
  SSL_HOST_KEY: /etc/grid-security/hostkey.pem
  # Backup trust path: the patched build also honours SSL_CERT_DIR
  SSL_CERT_DIR: /etc/grid-security/certificates

x-node: &node
  image: hepcdn-test-nginx-webdav
  build:
    # nginx/ of this repository (this file lives in test-harness/)
    context: ../nginx
    dockerfile: nginx.dockerfile
  depends_on:
    - idp
  restart: unless-stopped
  environment: *node-env

services:
  idp:
    image: hepcdn-test-idp
    build:
      context: ./mock-idp
    container_name: hepcdn-idp
    environment:
      ISSUER: https://idp:8443/
      # client_id:client_secret pairs for the client_credentials grant
      CLIENTS: hepcdn:hepcdn-secret
    volumes:
      - ./certs/idp:/certs:ro
      - ./certs/ca-bundle.pem:/ca-bundle.pem:ro
      - ./hepcdn_http.py:/hepcdn_http.py:ro
      - ./run/tok:/tok
    ports:
      - "20443:8443"
    restart: unless-stopped

  node1:
    <<: *node
    container_name: hepcdn-node1
    environment:
      <<: *node-env
      SERVER_NAME: node1
      SERVER_ADDRESS: https://node1:8080/
    volumes:
      - ./config/node1.json:/etc/nginx/lua/config.json:ro
      - ./certs/node1/cert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/node1/key.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
      - ./certs/ca-bundle-dir:/etc/grid-security/certificates:ro
      - node1-storage:/var/www/webdav
    ports:
      - "20081:8080"

  node2:
    <<: *node
    container_name: hepcdn-node2
    environment:
      <<: *node-env
      SERVER_NAME: node2
      SERVER_ADDRESS: https://node2:8080/
    volumes:
      - ./config/node2.json:/etc/nginx/lua/config.json:ro
      - ./certs/node2/cert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/node2/key.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
      - ./certs/ca-bundle-dir:/etc/grid-security/certificates:ro
      - node2-storage:/var/www/webdav
    ports:
      - "20082:8080"

  node3:
    <<: *node
    container_name: hepcdn-node3
    environment:
      <<: *node-env
      SERVER_NAME: node3
      SERVER_ADDRESS: https://node3:8080/
    volumes:
      - ./config/node3.json:/etc/nginx/lua/config.json:ro
      - ./certs/node3/cert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/node3/key.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
      - ./certs/ca-bundle-dir:/etc/grid-security/certificates:ro
      - node3-storage:/var/www/webdav
    ports:
      - "20083:8080"

  node4:
    <<: *node
    container_name: hepcdn-node4
    environment:
      <<: *node-env
      SERVER_NAME: node4
      SERVER_ADDRESS: https://node4:8080/
    volumes:
      - ./config/node4.json:/etc/nginx/lua/config.json:ro
      - ./certs/node4/cert.pem:/etc/grid-security/hostcert.pem:ro
      - ./certs/node4/key.pem:/etc/grid-security/hostkey.pem:ro
      - ./certs/ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
      - ./certs/ca-bundle-dir:/etc/grid-security/certificates:ro
      - node4-storage:/var/www/webdav
    ports:
      - "20084:8080"

volumes:
  node1-storage:
  node2-storage:
  node3-storage:
  node4-storage:
